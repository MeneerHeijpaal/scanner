id: frontpage-detect

info:
  name: Microsoft FrontPage Detection
  author: scanner
  severity: info
  description: Detects Microsoft FrontPage Server Extensions. Used as the gate in
    the tech-conditional workflow so the FrontPage CVE template (CVE-2000-0114)
    only runs against hosts exposing FrontPage.
  tags: tech,frontpage,microsoft

http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_inf.html"
      - "{{BaseURL}}/_vti_bin/shtml.dll"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        name: frontpage
        part: body
        words:
          - "FrontPage"
          - "_vti_"
          - "vti_encoding"
        condition: or
      - type: word
        name: frontpage
        part: header
        words:
          - "MicrosoftOfficeWebServer"
          - "MicrosoftSharePointTeamServices"
        condition: or
