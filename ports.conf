# ports.conf - ports scanned by naabu (Python/naabu_scan.py)
#
# Define the ports you want naabu to scan against the hosts derived from your
# URL list. One port per line, or a comma-separated list; ranges (e.g. 8000-8100)
# are also allowed. Lines starting with '#' and blank lines are ignored.
#
# Edit this file to change the scanned ports; the naabu wrapper reads it at runtime.

21     # FTP
22     # SSH
23     # Telnet
25     # SMTP
110    # POP3
143    # IMAP
445    # SMB
993    # IMAPS
995    # POP3S
2222   # SSH (alternate)
